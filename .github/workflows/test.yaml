name: test

on:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Run tests
        run: ./gradlew test
