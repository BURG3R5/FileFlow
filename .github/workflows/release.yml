name: release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Build APKs
        run: |
          ./gradlew assembleRelease
          ./gradlew assembleReleaseWithNetwork
          mv app/build/outputs/apk/release/app-release-unsigned.apk FileFlow_${{ github.ref_name }}.apk
          mv app/build/outputs/apk/releaseWithNetwork/app-releaseWithNetwork-unsigned.apk FileFlow_with-network_${{ github.ref_name }}.apk

      - name: Sign APKs
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          echo "${KEYSTORE}" | base64 -d > apksign.keystore
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign --ks apksign.keystore --ks-pass env:SIGNING_STORE_PASSWORD "FileFlow_${{ github.ref_name }}.apk"
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign --ks apksign.keystore --ks-pass env:SIGNING_STORE_PASSWORD "FileFlow_with-network_${{ github.ref_name }}.apk"

      - name: Collect mappings
        run: |
          mkdir mappings
          mv app/build/outputs/mapping/release/mapping.txt mappings/FileFlow_${{ github.ref_name }}.txt
          mv app/build/outputs/mapping/releaseWithNetwork/mapping.txt mappings/FileFlow_with-network_${{ github.ref_name }}.txt

      - name: Create release
        uses: meeDamian/github-release@v2.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          gzip: folders
          files: >
            FileFlow_${{ github.ref_name }}.apk
            FileFlow_with-network_${{ github.ref_name }}.apk

      - name: Upload mapping
        uses: actions/upload-artifact@v7
        with:
          name: FileFlow_mappings
          path: mappings/
