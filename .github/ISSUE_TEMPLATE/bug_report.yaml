name: Bug report
description: "Report unexpected behavior or crashes"

labels: bug
assignees: BURG3R5

body:
  - type: textarea
    attributes:
      label: Problem description
      description: "A clear and concise description of the problem."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: "Steps to reproduce the bug."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Screenshots and logs
      description: "Any relevant screenshots and logs."
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: Optional enhancements
      description: "Which of the following optional enhancements have you turned on? You can confirm by going to the Settings page."
      options:
        - label: Disable optimization
        - label: All files access
        - label: Enable rule names
        - label: Display full paths
        - label: Override extensions
  - type: textarea
    attributes:
      label: Additional context
      description: "Any other context about the bug report."
    validations:
      required: false
